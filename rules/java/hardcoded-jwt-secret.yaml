rules:
  - id: shieldgate.java.hardcoded-jwt-secret
    languages: [java]
    severity: ERROR
    message: A JWT is signed or verified with a hardcoded key; anyone with the source can forge tokens.
    metadata:
      shortDescription: Hardcoded JWT signing secret
      category: secret
      severity: HIGH
      cwe: ["CWE-798: Use of Hard-coded Credentials", "CWE-321: Use of Hard-coded Cryptographic Key"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      fix: Inject the key from configuration backed by a secret store (e.g. @Value("${jwt.secret}") sourced from env/Vault) and rotate the leaked value.
      confidence: HIGH
    pattern-either:
      - pattern: Algorithm.HMAC256("...")
      - pattern: Algorithm.HMAC384("...")
      - pattern: Algorithm.HMAC512("...")
      - pattern: $B.signWith($ALG, "...")
      - pattern: $B.setSigningKey("...")
      - pattern: Keys.hmacShaKeyFor("...".getBytes(...))
      - patterns:
          - pattern-inside: |
              $T $K = "...";
              ...
          - pattern-either:
              - pattern: Algorithm.HMAC256($K)
              - pattern: $B.signWith($ALG, $K)
              - pattern: $B.setSigningKey($K)
