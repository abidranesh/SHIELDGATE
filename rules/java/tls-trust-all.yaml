rules:
  - id: shieldgate.java.tls-trust-all
    languages: [java]
    severity: ERROR
    message: >-
      A TrustManager/HostnameVerifier accepts every certificate or hostname, disabling TLS validation
      (man-in-the-middle).
    metadata:
      shortDescription: TLS certificate/hostname verification disabled
      severity: HIGH
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A02:2021 - Cryptographic Failures", "A07:2021 - Identification and Authentication Failures"]
      fix: Use the platform default TrustManager; for private CAs load them into a KeyStore and build a TrustManagerFactory from it.
      confidence: HIGH
    pattern-either:
      - pattern: |
          public void checkServerTrusted(...) { }
      - pattern: |
          public void checkServerTrusted(...) throws $E { }
      - pattern: |
          public boolean verify(String $H, SSLSession $S) { return true; }
      - pattern: "($H, $S) -> true"
      - pattern: NoopHostnameVerifier.INSTANCE
