rules:
  - id: shieldgate.python.open-redirect
    languages: [python]
    severity: WARNING
    message: >-
      The redirect target comes from the request. Attackers can craft links on your domain that
      bounce victims to a phishing site (open redirect).
    metadata:
      shortDescription: Open redirect
      severity: MEDIUM
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2021 - Broken Access Control"]
      fix: Only redirect to relative paths or an allowlist of hosts (e.g. django.utils.http.url_has_allowed_host_and_scheme), otherwise fall back to a fixed URL.
      confidence: MEDIUM
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$A
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.GET
          - pattern: request.POST
    pattern-sanitizers:
      - pattern-either:
          - pattern: url_has_allowed_host_and_scheme(...)
          - pattern: url_for(...)
    pattern-sinks:
      - pattern-either:
          - pattern: redirect(...)
          - pattern: flask.redirect(...)
          - pattern: HttpResponseRedirect(...)
          - pattern: django.shortcuts.redirect(...)
