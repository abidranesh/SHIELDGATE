rules:
  - id: shieldgate.python.hardcoded-jwt-secret
    languages: [python]
    severity: ERROR
    message: >-
      A JWT is signed/verified with a hardcoded string key. Anyone with access to the source can
      forge valid tokens for any user.
    metadata:
      shortDescription: Hardcoded JWT signing secret
      category: secret
      severity: HIGH
      cwe: ["CWE-798: Use of Hard-coded Credentials", "CWE-321: Use of Hard-coded Cryptographic Key"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      fix: Load the key from the environment or a secret manager (os.environ["JWT_SECRET"]) and rotate the leaked value.
      confidence: HIGH
    pattern-either:
      - pattern: jwt.encode($P, "...", ...)
      - pattern: jwt.decode($T, "...", ...)
      - pattern: jwt.encode($P, key="...", ...)
      - pattern: jwt.decode($T, key="...", ...)
      - patterns:
          - pattern-inside: |
              $K = "..."
              ...
          - pattern-either:
              - pattern: jwt.encode($P, $K, ...)
              - pattern: jwt.decode($T, $K, ...)
      - patterns:
          - pattern: $APP.config[$KEY] = "..."
          - metavariable-regex:
              metavariable: $KEY
              regex: ^["'](JWT_SECRET_KEY|SECRET_KEY)["']$
