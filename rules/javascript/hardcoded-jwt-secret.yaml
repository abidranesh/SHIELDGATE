rules:
  - id: shieldgate.js.hardcoded-jwt-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      jsonwebtoken sign/verify uses a hardcoded string secret. Anyone with the source can forge tokens.
    metadata:
      shortDescription: Hardcoded JWT signing secret
      category: secret
      severity: HIGH
      cwe: ["CWE-798: Use of Hard-coded Credentials", "CWE-321: Use of Hard-coded Cryptographic Key"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      fix: Read the secret from process.env.JWT_SECRET (fail fast if unset) or a secret manager, and rotate the exposed value.
      confidence: HIGH
    pattern-either:
      - pattern: $JWT.sign($P, "...", ...)
      - pattern: $JWT.verify($T, "...", ...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  const $K = "...";
                  ...
              - pattern-inside: |
                  let $K = "...";
                  ...
              - pattern-inside: |
                  var $K = "...";
                  ...
          - pattern-either:
              - pattern: $JWT.sign($P, $K, ...)
              - pattern: $JWT.verify($T, $K, ...)
      - pattern: "expressJwt({..., secret: '...', ...})"
      - pattern: "jwt({..., secret: '...', ...})"
