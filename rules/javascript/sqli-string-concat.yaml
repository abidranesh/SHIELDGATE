rules:
  - id: shieldgate.js.sqli-string-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      SQL text is built with concatenation or a template literal containing variables and passed to a
      query function (SQL injection).
    metadata:
      shortDescription: SQL injection via string-built query
      severity: HIGH
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      owasp: ["A03:2021 - Injection"]
      fix: Use placeholders, e.g. db.query("SELECT * FROM users WHERE id = $1", [id]) or the ORM's replacements option.
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $DB.$Q(`$SQL${...}...`, ...)
          - pattern: $DB.$Q("$SQL" + $X, ...)
          - pattern: $DB.$Q("$SQL" + $X + $Y, ...)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $V = "$SQL" + $X;
                      ...
                  - pattern-inside: |
                      $V = "$SQL" + $X + $Y;
                      ...
                  - pattern-inside: |
                      $V = `$SQL${...}...`;
                      ...
                  - pattern-inside: |
                      const $V = "$SQL" + $X;
                      ...
                  - pattern-inside: |
                      const $V = "$SQL" + $X + $Y;
                      ...
                  - pattern-inside: |
                      let $V = "$SQL" + $X;
                      ...
                  - pattern-inside: |
                      let $V = "$SQL" + $X + $Y;
                      ...
                  - pattern-inside: |
                      const $V = `$SQL${...}...`;
                      ...
              - pattern: $DB.$Q($V, ...)
      - metavariable-regex:
          metavariable: $Q
          regex: ^(query|execute|raw|exec|all|get|run|each|prepare|sequelize\.query)$
      - metavariable-regex:
          metavariable: $SQL
          regex: (?is)^\s*(select|insert|update|delete|with|replace|merge)\b.*
