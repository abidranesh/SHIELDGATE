rules:
  - id: shieldgate.js.tls-verify-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      TLS certificate validation is disabled (rejectUnauthorized: false / NODE_TLS_REJECT_UNAUTHORIZED=0),
      allowing man-in-the-middle attacks.
    metadata:
      shortDescription: TLS certificate verification disabled
      severity: HIGH
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A02:2021 - Cryptographic Failures", "A07:2021 - Identification and Authentication Failures"]
      fix: "Remove rejectUnauthorized false; for private CAs pass the CA bundle via the `ca` option (fs.readFileSync(\"ca.pem\")) instead."
      confidence: HIGH
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
      - pattern: "{..., strictSSL: false, ...}"
