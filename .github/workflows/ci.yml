name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" "semgrep==1.183.0"
      - name: Unit tests (normalizer, deduper, baseline, renderer, SARIF, diff scope)
        run: pytest -q
      - name: Validate Semgrep rules
        run: semgrep --validate --metrics=off --config rules/
      - name: Semgrep rule tests (ruleid / ok annotations)
        run: semgrep --test --metrics=off rules/
      - name: Rule metadata lint (CWE, OWASP, fix on every rule)
        run: python scripts/lint_rules.py
