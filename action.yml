name: "Shieldgate Security Scan"
description: "Free PR security gate: custom Semgrep rules + Gitleaks + OSV-Scanner + Checkov, one sticky PR comment, SARIF."
author: "abidranesh"
branding:
  icon: "shield"
  color: "green"

inputs:
  path:
    description: "Directory to scan (relative to the workspace)"
    default: "."
  fail-on:
    description: "Fail the job when a finding is at or above this severity: critical|high|medium|low|info|none"
    default: "high"
  scope:
    description: "auto (changed lines on pull_request, full repo otherwise) | diff | full"
    default: "auto"
  scanners:
    description: "Comma-separated subset of semgrep,gitleaks,osv,checkov"
    default: "semgrep,gitleaks,osv,checkov"
  baseline:
    description: "Path to the baseline/suppression file"
    default: ".shieldgate-baseline.yml"
  exclude:
    description: "Newline-separated globs of paths to ignore (e.g. tests/fixtures/*)"
    default: ""
  extra-rules:
    description: "Optional extra Semgrep config (path or registry id) in addition to the bundled pack"
    default: ""
  comment:
    description: "Create/update a single PR comment with the results (needs pull-requests: write)"
    default: "true"
  upload-sarif:
    description: "Upload SARIF to GitHub code scanning (needs security-events: write)"
    default: "true"
  token:
    description: "Token used for the PR comment"
    default: ${{ github.token }}

outputs:
  findings:
    description: "Number of findings reported (after diff scope and baseline)"
    value: ${{ steps.scan.outputs.findings }}
  sarif-file:
    description: "Path to the SARIF report"
    value: ${{ steps.scan.outputs.sarif }}
  exit-code:
    description: "0 = pass, 1 = findings at/above fail-on, 2 = configuration error"
    value: ${{ steps.scan.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install pinned scanners
      shell: bash
      env:
        SEMGREP_VERSION: "1.95.0"
        CHECKOV_VERSION: "3.2.300"
        GITLEAKS_VERSION: "8.21.2"
        GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        OSV_VERSION: "1.9.2"
        OSV_SHA256: "d6af4b67fa5de658598bd2d445efb99e90d1734b3146962418719c4350ecb74b"
        SCANNERS: ${{ inputs.scanners }}
      run: |
        set -euo pipefail
        BIN="$RUNNER_TEMP/shieldgate-bin"; mkdir -p "$BIN"; echo "$BIN" >> "$GITHUB_PATH"
        python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"
        [[ "$SCANNERS" == *semgrep* ]] && python -m pip install --quiet --disable-pip-version-check "semgrep==$SEMGREP_VERSION"
        [[ "$SCANNERS" == *checkov* ]] && python -m pip install --quiet --disable-pip-version-check "checkov==$CHECKOV_VERSION"
        if [[ "$SCANNERS" == *gitleaks* ]]; then
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$BIN" gitleaks
        fi
        if [[ "$SCANNERS" == *osv* ]]; then
          curl -sSfL -o "$BIN/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $BIN/osv-scanner" | sha256sum -c -
          chmod +x "$BIN/osv-scanner"
        fi

    - name: Make PR base commit available for diff scoping
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=50 origin "$BASE_SHA" || true

    - name: Run Shieldgate
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        IN_PATH: ${{ inputs.path }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_SCOPE: ${{ inputs.scope }}
        IN_SCANNERS: ${{ inputs.scanners }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_EXCLUDE: ${{ inputs.exclude }}
        IN_EXTRA_RULES: ${{ inputs.extra-rules }}
        IN_COMMENT: ${{ inputs.comment }}
      run: |
        set +e
        OUT="$RUNNER_TEMP/shieldgate"; mkdir -p "$OUT"
        args=(scan "$IN_PATH" --scope "$IN_SCOPE" --fail-on "$IN_FAIL_ON" --scanners "$IN_SCANNERS"
              --baseline "$IN_BASELINE" --sarif "$OUT/shieldgate.sarif" --json "$OUT/findings.json"
              --markdown "$OUT/comment.md")
        while IFS= read -r g; do [[ -n "${g// }" ]] && args+=(--exclude "$g"); done <<< "$IN_EXCLUDE"
        [[ -n "$IN_EXTRA_RULES" ]] && args+=(--extra-rules "$IN_EXTRA_RULES")
        [[ "$IN_COMMENT" == "true" ]] && args+=(--comment)
        shieldgate "${args[@]}"
        code=$?
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        echo "sarif=$OUT/shieldgate.sarif" >> "$GITHUB_OUTPUT"
        echo "findings=$(python -c "import json;print(len(json.load(open('$OUT/findings.json'))))" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload SARIF to code scanning
      if: inputs.upload-sarif == 'true' && (steps.scan.outputs.exit_code == '0' || steps.scan.outputs.exit_code == '1')
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true  # e.g. code scanning disabled, or fork PR without security-events: write
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: shieldgate

    - name: Enforce fail threshold
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit_code }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [[ "$CODE" == "1" ]]; then echo "::error::Shieldgate found issues at or above '$FAIL_ON'"; exit 1; fi
        if [[ "$CODE" != "0" ]]; then echo "::error::Shieldgate failed (exit $CODE)"; exit "$CODE"; fi
