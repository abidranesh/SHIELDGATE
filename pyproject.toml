[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldgate"
version = "0.1.0"
description = "Free, open-source PR security gate: Semgrep (custom rules) + Gitleaks + OSV-Scanner + Checkov"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shieldgate = "shieldgate.cli:main"

[tool.setuptools]
packages = ["shieldgate", "shieldgate.scanners"]

[tool.pytest.ini_options]
testpaths = ["tests"]
